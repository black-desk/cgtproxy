# This file is my daily use configuration,
# I use it to show how to use cgtproxy with clash-meta.
#
# Configuration fields and behavior are documented in GoDoc:
# https://pkg.go.dev/github.com/black-desk/cgtproxy/internal/cgtproxy/config#Config

version: 1
cgroup-root: AUTO # path to cgroupfs v2 mount point or "AUTO"
route-table: 300

# Apply the root cgroup target to traffic routed through this host, for example
# from LAN devices, virtual machines, or Docker bridge containers.
# Gateway mode is off by default; this daily-use example enables it.
# Local cgroup rules are independent of this.
# Forwarded traffic shares this target because the sending process's cgroup
# cannot be determined. Without a root match, forwarding remains unchanged.
# cgtproxy does not enable IP forwarding or configure interface settings,
# firewall permissions, or NAT for direct forwarding; configure these separately.
# Docker usually supplies these settings for its bridges.
# For a minimal gateway setup, define a proxy named clash-meta and use:
#   gateway: true
#   rules:
#     - match: "^/$"
#       tproxy: clash-meta
# For container DNS timeouts, see:
# https://github.com/black-desk/cgtproxy/blob/master/docs/troubleshooting.md#docker-container-dns-times-out-in-gateway-mode
gateway: true

# This means any traffic send to 127.0.0.1 and ::1 will be directly send
# without influenced by the following configuration.
bypass:
  - 127.0.0.0/8
  - ::1

tproxies:
  clash-meta:
    mark: 3000
    port: 7893

    # Do not proxy UDP traffic. They will be send directly.
    # no-udp: false

    # Do not proxy IPv6 traffic. They will be send directly.
    # no-ipv6: false

    # Hijack all IPv4 traffic which destination port is 53
    # and redirect them to ip:port.
    # This field is optional.
    # In gateway mode, hijacking forwarded DNS to this loopback address requires
    # route_localnet on the host's incoming interface. After Docker creates
    # docker0, check and enable it on the host:
    #   sysctl net.ipv4.conf.docker0.route_localnet
    #   sudo sysctl -w net.ipv4.conf.docker0.route_localnet=1
    #
    # To persist the setting, put this in /etc/sysctl.d/90-cgtproxy.conf:
    #   net.ipv4.conf.docker0.route_localnet = 1
    # With standard systemd udev rules, settings are applied when the interface
    # appears, so this file can be saved before docker0 exists. If the interface
    # already exists, apply the file immediately:
    #   sudo sysctl --load=/etc/sysctl.d/90-cgtproxy.conf
    # On systems without this mechanism, arrange to reload the setting after
    # interface creation or recreation. See sysctl.d(5).
    #
    # Replace docker0 with the actual incoming interface for custom bridges.
    # Alternatively, use a local non-loopback address where the DNS service
    # listens and which is reachable from that interface.
    # cgtproxy does not change these sysctls automatically.
    dns-hijack:
      ip: 127.0.0.1
      port: 53

# Rules are matched in order.
# The target selected for `/` is used as the fallback for local cgroups.
# With gateway: true, forwarded traffic also uses this target.
# An explicit `match: '^/$'` rule can select this target independently.
# `match` is an regex to match the cgroup path.
# `direct` means the traffic will not be redirect to any TPROXY server;
# `tproxy` means the traffic will be redirect to that TPROXY server.
#
# NOTE: You can use systemd-cgls to check the cgroup layout on your system.
#
# NOTE: Any web service will provide their service directly.
#       Traffics in connection created by remote host
#       will never redirect to TPROXY server.
rules:
  # This rule match the clash-meta core.
  # Make cgtproxy produce nft rules that
  # route the network traffic comes from this cgroupfs as usual.
  - # AUR packages `clash-meta` and `clash-meta-bin`
    # contains the `clash-meta` systemd service,
    # which will be launched by systemd
    # in cgroup `/system.slice/clash-meta.service`.
    # But [my clash-meta deb package](https://github.com/black-desk/debs/tree/master/one.metacubex.clash-meta)
    # use a systemd service name `one.metacubex.clash-meta`.
    match: |-
      \/system\.slice\/(?:one\.metacubex\.)?clash-meta\.service
    direct: true

  # Same as above.
  # Let's configure the user-level `cgtproxy-direct.slice`
  # and `cgtproxy-proxy.slice` cgroups.
  #
  # Using this setup, you can start a non-proxy shell
  # by execute:
  #
  # ```bash
  # systemd-run --user --slice cgtproxy-direct.slice --shell
  # ```
  #
  # The command above start the new shell in a cgroup like
  # `/user.slice/user-1000.slice/user@1000.service/cgtproxy.slice/cgtproxy-direct.slice/run-u22.service`,
  # which match the regex in your configuration.
  # Then cgtproxy will produce nft rules to
  # make that `run-u22.service` get rid of transparent proxy.
  - match: |-
      \/user\.slice\/user-\d+\.slice/user@\d+\.service\/cgtproxy\.slice\/cgtproxy-direct\.slice\/.*
    direct: true
  - match: |-
      \/user\.slice\/user-\d+\.slice/user@\d+\.service\/cgtproxy\.slice\/cgtproxy-proxy\.slice\/.*
    tproxy: clash-meta

  # Application related rules:
  # To make these rules working across desktop environments,
  # please take a look on https://systemd.io/DESKTOP_ENVIRONMENTS/.
  # NOTE:
  # | Desktop Environment | Launcher    |
  # |---------------------|-------------|
  # | GNOME               | `"gnome"`   |
  # | dde                 | `"DDE"`     |
  # | KDE                 | none        |
  # | flatpak             | `"flatpak"` |
  # So we should use
  # ```
  # \/user\.slice\/user-\d+\.slice\/user@\d+\.service\/app\.slice\/app(?:-(?:gnome|DDE|flatpak))?-APPID(?:-.+\.scope|(?:@.+)?\.service)
  # ```
  # to match application named `APPID`.
  # Check https://regex101.com/r/BgZcws/2 for example application cgroup names.

  # https://parsec.app/
  # `parsec` should always connect to network directly.
  - match: |-
      \/user\.slice\/user-\d+\.slice\/user@\d+\.service\/app\.slice\/app(?:-(?:gnome|DDE|flatpak))?-(?:parsecd|com\.parsecgaming\.parsec)(?:-.+\.scope|(?:@.+)?\.service)
    direct: true

  # For any cgroup else, TPROXY to clash-meta.
  - match: |-
      \/.*
    tproxy: clash-meta
