name: Continuous deployment

on:
  workflow_call:

jobs:
  goreleaser:
    concurrency:
      group: cgtproxy-release
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: black-desk/workflows/goreleaser@master
