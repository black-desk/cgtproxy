version: 1
cgroup-root: AUTO
route-table: 31300
bypass:
  - 127.0.0.0/8
  - ::1
  - 198.51.100.20
  - 2001:db8::20/128
tproxies:
  proxy:
    port: 17893
    mark: 42042
    no-udp: true
  second:
    port: 17894
    mark: 42043
rules:
  - match: "/servers$"
    direct: true
  - match: "/manager$"
    direct: true
  - match: "/direct$"
    direct: true
  - match: "/blocked$"
    drop: true
  - match: "/proxied/drop$"
    drop: true
  - match: "/proxied/second$"
    tproxy: second
  - match: "/proxied(/.*)?$"
    tproxy: proxy
  - match: "^/$"
    tproxy: proxy
