version: 1
cgroup-root: AUTO
route-table: 31300
gateway: true
bypass:
  - 127.0.0.0/8
  - ::1
tproxies:
  proxy:
    port: 17893
    mark: 42042
rules:
  - match: "/(servers|manager)$"
    direct: true
  - match: "/proxied/(initial|live|transient)$"
    direct: true
  - match: "^/$"
    tproxy: proxy
