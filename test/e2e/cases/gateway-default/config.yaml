version: 1
cgroup-root: AUTO
route-table: 31300
bypass:
  - 127.0.0.0/8
  - ::1
tproxies:
  proxy:
    port: 17893
    mark: 42042
    dns-hijack:
      ip: 172.31.254.1
      port: 15353
      tcp: true
rules:
  - match: "/servers$"
    direct: true
  - match: "/manager$"
    direct: true
  - match: "^/$"
    tproxy: proxy
